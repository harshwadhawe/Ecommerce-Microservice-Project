events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 3000;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # No /api/ proxy on purpose. There is no single "backend" host -- the five services listen
        # on 8081-8085 -- and nginx resolves upstreams at startup, so a name that does not exist
        # crashes the container rather than failing lazily on request. When the React pages gain an
        # API layer, add one location per service (or route through an ingress) pointing at real
        # hostnames.
    }
}