server:
  port: 8083

spring:
  application:
    name: cart-service
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ecommerce.cartservice: INFO
    org.springframework.data.redis: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  redis:
    host: redis
    port: 6379

app:
  product-service:
    url: http://product-service:8082