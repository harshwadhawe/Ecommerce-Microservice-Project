server:
  port: 8082

spring:
  application:
    name: product-service
  
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:productdb}
      username: ${MONGODB_USERNAME:admin}
      password: ${MONGODB_PASSWORD:password}
      authentication-database: admin

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ecommerce.productservice: INFO
    org.springframework.data.mongodb: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      host: mongodb
      port: 27017