name: CI

on: push

jobs:
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, product-service, cart-service, payment-service, order-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn -B -f backend/${{ matrix.service }}/pom.xml verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test -- --watchAll=false
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  e2e:
    name: End-to-end API tests
    runs-on: ubuntu-latest
    needs: unit

    # Defaults in each application.yml already point at localhost with these credentials,
    # so the services need no extra configuration on the runner.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ecommerce
          MYSQL_USER: ecommerce
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s --health-timeout=5s --health-retries=10

      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: productdb
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build service jars
        run: |
          for service in user-service product-service cart-service payment-service; do
            mvn -B -q -f "backend/$service/pom.xml" package -DskipTests
          done

      - name: Start services
        run: |
          mkdir -p logs
          for service in user-service product-service cart-service payment-service; do
            java -jar "backend/$service/target/$service-1.0.0.jar" > "logs/$service.log" 2>&1 &
          done

      - name: Run end-to-end tests
        env:
          WAIT_SECONDS: 180
        run: ./test-e2e.sh

      - name: Service logs
        if: failure()
        run: tail -n 100 logs/*.log
