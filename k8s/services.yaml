      # "tcp://10.96.x.x:6379", which collides with this app's own ${REDIS_PORT}/${MYSQL_PORT}/
      # ${MONGODB_PORT} placeholders and fails startup on a NumberFormatException.
      enableServiceLinks: false
      containers:
        - name: payment-service
          image: ecommerce/payment-service:local
