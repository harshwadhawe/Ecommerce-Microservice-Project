apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | quote }}
  mysql-root-password: {{ .Values.secrets.mysqlRootPassword | quote }}
  mongodb-password: {{ .Values.secrets.mongodbPassword | quote }}
