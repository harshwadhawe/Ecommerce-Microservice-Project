version: '3.8'

services:
  # Databases
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-network

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: productdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ecommerce-network

  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-network

  # Microservices
  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=ecommerce
      - MYSQL_USERNAME=ecommerce
      - MYSQL_PASSWORD=password
      - JWT_SECRET=mySecretKey123456789012345678901234567890
    depends_on:
      - mysql
    networks:
      - ecommerce-network

  product-service:
    build: ./backend/product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=productdb
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  cart-service:
    build: ./backend/cart-service
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=mySecretKey123456789012345678901234567890
      - PRODUCT_SERVICE_URL=http://product-service:8082
    depends_on:
      - redis
    networks:
      - ecommerce-network

  order-service:
    build: ./backend/order-service
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=ecommerce
      - MYSQL_USERNAME=ecommerce
      - MYSQL_PASSWORD=password
      - JWT_SECRET=mySecretKey123456789012345678901234567890
      - USER_SERVICE_URL=http://user-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - CART_SERVICE_URL=http://cart-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8085
    depends_on:
      - mysql
      - user-service
      - product-service
      - cart-service
      - payment-service
    networks:
      - ecommerce-network

  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ecommerce-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_USER_SERVICE_URL=http://localhost:8081
      - REACT_APP_PRODUCT_SERVICE_URL=http://localhost:8082
      - REACT_APP_CART_SERVICE_URL=http://localhost:8083
      - REACT_APP_ORDER_SERVICE_URL=http://localhost:8084
      - REACT_APP_PAYMENT_SERVICE_URL=http://localhost:8085
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
    networks:
      - ecommerce-network

volumes:
  mysql-data:
  mongodb-data:
  redis-data:

networks:
  ecommerce-network:
    driver: bridge